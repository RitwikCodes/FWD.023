<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ProfLine - Sign Up</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="login-page">
  <main class="login-screen">
    <button class="theme-toggle icon-theme-toggle" type="button" aria-label="Toggle dark mode" aria-pressed="false">
      <svg class="theme-icon theme-icon-moon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M20.985 12.486A9 9 0 1 1 11.514 3.015a7 7 0 0 0 9.471 9.471Z" />
      </svg>
      <svg class="theme-icon theme-icon-sun" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <circle cx="12" cy="12" r="4" />
        <path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42" />
      </svg>
    </button>
    <section class="login-panel" aria-labelledby="signup-heading">
      <header class="login-card-header">
        <h1 id="signup-heading">Create Account</h1>
        <p>Set up your ProfLine student or faculty portal</p>
        <div class="auth-switch" role="group" aria-label="Sign in or sign up">
          <a class="auth-option" href="login.html">Sign In</a>
          <a class="auth-option active" href="signup.html" aria-current="page">Sign Up</a>
        </div>
      </header>

      <form class="login-form" action="signup.html" method="get">
        <label for="signup-name">Full Name</label>
        <input id="signup-name" type="text" autocomplete="name" placeholder="Enter your full name">

        <label for="login-id">ID</label>
        <input id="login-id" type="text" autocomplete="username" placeholder="Enter your ID">

        <label for="login-password">Password</label>
        <input id="login-password" type="password" autocomplete="new-password" placeholder="Create a password">

        <label for="confirm-password">Confirm Password</label>
        <input id="confirm-password" type="password" autocomplete="new-password" placeholder="Enter your password again">

        <button class="btn-primary" type="submit">Create Account</button>
      </form>
    </section>
  </main>
  <script src="script.js" defer></script>
</body>
</html>
